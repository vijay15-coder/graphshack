name: Record ReleaseRadar demo

on:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start FalkorDB and app
        run: docker compose up --build -d
      - name: Record graph-backed browser walkthrough
        run: node demo/record-demo.js
      - name: Name recorded video
        run: mv demo-video/*.webm demo-video/ReleaseRadar-demo.webm
      - name: Upload demo video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-radar-demo
          path: demo-video/
          if-no-files-found: warn
      - name: Publish public demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view demo-v1 >/dev/null 2>&1 || gh release create demo-v1 --title 'ReleaseRadar demo' --notes 'Real browser walkthrough against FalkorDB: HOLD, dependency evidence, persistent memory, and READY.' --target "$GITHUB_SHA"
          gh release upload demo-v1 demo-video/ReleaseRadar-demo.webm demo-video/*.png --clobber
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
