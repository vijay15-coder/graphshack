name: Record ReleaseRadar demo

on:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install chromium
      - name: Start FalkorDB and app
        run: docker compose up --build -d
      - name: Record graph-backed browser walkthrough
        run: node demo/record-demo.js
      - name: Upload demo video and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-radar-demo
          path: demo-video/
          if-no-files-found: warn
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
